<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchEngine - Drag and Drop Image Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Header Blurred */
        header {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #4f46e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tabs {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-tabs a {
            text-decoration: none;
            color: #777;
            font-size: 14px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Page Background Dimmed */
        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .blurred-background-cards {
            display: flex;
            gap: 15px;
            opacity: 0.2;
            filter: blur(3px);
            pointer-events: none;
        }

        .bg-card {
            width: 140px;
            height: 180px;
            background: #fff;
            border-radius: 12px;
        }

        /* Backdrop Overlay */
        .backdrop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dropzone Box */
        .dropzone-modal {
            background: #ffffff;
            width: 420px;
            height: 260px;
            border-radius: 16px;
            border: 2px dashed #818cf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            background-color: #fafbff;
        }

        .dropzone-text {
            color: #6366f1;
            font-size: 14px;
            font-weight: 500;
        }

        /* Dragged File Pill */
        .dragged-file-pill {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: #ffffff;
            border: 1px solid #e0e7ff;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.15);
            border-radius: 20px;
            padding: 4px 12px 4px 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #333;
        }

        .dragged-file-thumb {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
        }

        .cursor-pointer {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: #10b981;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid #fff;
        }

        /* Footer */
        footer {
            padding: 20px 0;
            text-align: center;
            font-size: 11px;
            color: #aaa;
        }

        footer a {
            color: #aaa;
            margin: 0 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-sparkles"></i> SearchEngine
        </div>
        <ul class="nav-tabs">
            <li><a href="#">Images</a></li>
            <li><a href="#">Videos</a></li>
            <li><a href="#">Shopping</a></li>
            <li><a href="#">News</a></li>
        </ul>
        <div class="user-profile">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" alt="Avatar" class="avatar">
            <span>Sofia Perez</span>
        </div>
    </header>

    <!-- Main Content Background -->
    <div class="page-content">
        <div class="blurred-background-cards">
            <div class="bg-card"></div>
            <div class="bg-card"></div>
            <div class="bg-card"></div>
            <div class="bg-card"></div>
        </div>
    </div>

    <!-- Drag & Drop Backdrop -->
    <div class="backdrop-overlay">
        <div class="dropzone-modal">
            <div class="dropzone-text">Drop here</div>

            <!-- Dragged image element simulation -->
            <div class="dragged-file-pill">
                <img src="https://images.unsplash.com/photo-1530018607912-eff2daa1bac4?w=100" class="dragged-file-thumb" alt="Thumb">
                <span>image-79000-8900.png</span>
                <div class="cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <a href="#">Manage Cookies</a> | 
        <a href="#">Privacy</a> | 
        <a href="#">Legal</a> | 
        <a href="#">About us</a> | 
        <a href="#">Help</a> | 
        <a href="#">Feedback</a>
    </footer>

</body>
</html>
