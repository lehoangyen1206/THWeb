
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Quantifiers {n}</title>
</head>
<body>
    <h2>Bài 1: Kiểm tra mã sinh viên gồm đúng 8 chữ số</h2>
    <input type="text" id="bai1" value="20261234" placeholder="Nhập mã sinh viên">
    <button onclick="kiemTraBai1()">Kiểm tra</button>
    <p id="kq1"></p>

    <h2>Bài 2: Lấy các từ dài từ 5 chữ cái trở lên</h2>
    <p>Chuỗi: i love regex and javascript</p>
    <button onclick="kiemTraBai2()">Tìm từ</button>
    <p id="kq2"></p>

    <h2>Bài 3: Kiểm tra số điện thoại gồm 10 chữ số</h2>
    <input type="text" id="bai3" value="0901234567" placeholder="Nhập số điện thoại">
    <button onclick="kiemTraBai3()">Kiểm tra</button>
    <p id="kq3"></p>

    <script>
        function kiemTraBai1() {
            let maSV = document.getElementById("bai1").value;
            let regex = /^\d{8}$/;

            document.getElementById("kq1").innerText =
                regex.test(maSV) ? "True" : "False";
        }

        function kiemTraBai2() {
            let chuoi = "i love regex and javascript";
            let regex = /\b[a-z]{5,}\b/g;
            let ketQua = chuoi.match(regex);

            document.getElementById("kq2").innerText =
                JSON.stringify(ketQua);
        }

        function kiemTraBai3() {
            let soDienThoai = document.getElementById("bai3").value;
            let regex = /^0\d{9}$/;

            document.getElementById("kq3").innerText =
                regex.test(soDienThoai) ? "True" : "False";
        }
    </script>
</body>
</html>
