<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập phần 1
    </title>
</head>
<body>

    <h2>Bài 1: Tìm các chữ số 1, 3, 5 trong "12345"</h2>

    <script>
        let chuoi1 = "12345";
        let ketQua1 = chuoi1.match(/[135]/g);

        document.write("Chuỗi ban đầu: " + chuoi1 + "<br>");
        document.write("Các chữ số tìm được: " + ketQua1);
    </script>

    <h2>Bài 2: Trong "Hello hello HELLO", tìm "hello" có chữ đầu viết hoa hoặc viết thường, còn các chữ sau phải viết thường</h2>

    <script>
        let chuoi2 = "Hello hello HELLO";
        let ketQua2 = chuoi2.match(/[Hh]ello/g);

        document.write("Chuỗi ban đầu: " + chuoi2 + "<br>");
        document.write("Các chữ tìm được: " + ketQua2);
    </script>

    <h2>Bài 3: Đếm số dấu câu . , ! ? trong "Xin chào, bạn khỏe không? Tốt!"</h2>

    <script>
        let chuoi3 = "Xin chào, bạn khỏe không? Tốt!";
        let ketQua3 = chuoi3.match(/[.,!?]/g);

        document.write("Chuỗi ban đầu: " + chuoi3 + "<br>");
        document.write("Kết quả: " + ketQua3);
    </script>
</body>
</html>
