
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Positive Lookahead</title>
</head>
<body>
    <h2>Bài 1: Lấy tên người dùng trước dấu @</h2>
    <p>Email: tien@gmail.com</p>
    <button onclick="kiemTraBai1()">Lấy tên người dùng</button>
    <p id="kq1"></p>

    <h2>Bài 2: Lấy số cân nặng trong chuỗi</h2>
    <p>Chuỗi: Nặng 65kg, cao 170cm</p>
    <button onclick="kiemTraBai2()">Lấy cân nặng</button>
    <p id="kq2"></p>

    <h2>Bài 3: Kiểm tra mật khẩu</h2>
    <input type="text" id="bai3" value="Abc123" placeholder="Nhập mật khẩu">
    <button onclick="kiemTraBai3()">Kiểm tra</button>
    <p id="kq3"></p>

    <script>
        function kiemTraBai1() {
            let chuoi = "tien@gmail.com";
            let regex = /\w+(?=@)/;
            let ketQua = chuoi.match(regex);

            document.getElementById("kq1").innerText =
                ketQua ? ketQua[0] : "Không tìm thấy";
        }

        function kiemTraBai2() {
            let chuoi = "Nặng 65kg, cao 170cm";
            let regex = /\d+(?=kg)/g;
            let ketQua = chuoi.match(regex);

            document.getElementById("kq2").innerText =
                JSON.stringify(ketQua);
        }

        function kiemTraBai3() {
            let matKhau = document.getElementById("bai3").value;
            let regex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;

            document.getElementById("kq3").innerText =
                regex.test(matKhau) ? "True" : "False";
        }
    </script>
</body>
</html>
